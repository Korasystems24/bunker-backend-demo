[project]
name = "backend-demo"
version = "0.1.0"
description = "Backend демо мониторинга бункеров: приём телеметрии EdgePC, TimescaleDB, Query API для фронта"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.30.0",
    "fastapi>=0.141.1",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.29.0",
    "httpx>=0.28.1",
    "pytest>=8.4.0",
    "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TC",  # flake8-type-checking
    "RUF", # ruff-specific
]
# Комментарии/докстринги проекта на русском: ложные срабатывания
# «двусмысленных» кириллических букв, похожих на латиницу.
ignore = ["RUF002", "RUF003"]

[tool.basedpyright]
include = ["src"]
# TODO(шаг 2 / день 2): убрать ignore после переноса контракта edge в src/domain
# (сейчас там недописанные файлы: constants.py, beam.py, event_payload.py).
ignore = ["src/domain"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
