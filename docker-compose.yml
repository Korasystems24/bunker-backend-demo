services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bunker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bunker}
      POSTGRES_DB: ${POSTGRES_DB:-bunker}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Расширение timescaledb создаётся при первой инициализации тома.
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-bunker} -d ${POSTGRES_DB:-bunker}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      BUNKER_DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-bunker}:${POSTGRES_PASSWORD:-bunker}@db:5432/${POSTGRES_DB:-bunker}
      BUNKER_API__EDGE_AUTH_TOKEN: ${BUNKER_API__EDGE_AUTH_TOKEN:?set BUNKER_API__EDGE_AUTH_TOKEN in .env}
      BUNKER_ENVIRONMENT: production
      BUNKER_LOGGING__JSON_LOGS: "true"
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

volumes:
  pgdata: